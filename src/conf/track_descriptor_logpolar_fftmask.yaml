# Log-polar descriptor with the DFT-magnitude head + learned mask-aware pooling, on
# track data. Model block mirrors blob_descriptor_logpolar_fftmask. `with_mask: true`
# feeds the per-patch board-in-frame masks stored in the `.tracks` file so the anchor
# mask supervision (and mask-aware pooling) matches the source model.
defaults:
  - track_descriptor_base
  - _self_
  - track_angle_validation

scale: 16.0

model:
  name: HardNetLogPolar
  params:
    in_channels: 1
    patch_size: 64
    head: fft
    n_harmonics: 5
    learned_mask: true

training:
  ignore_mask: false
  mask_loss_weight: 1.0
  dataset:
    params:
      patch_type: logpolar
      with_mask: true
validation:
  dataset:
    params:
      patch_type: logpolar
      with_mask: true
