# Efficient steerable descriptor on track data. Model block mirrors
# blob_descriptor_efficient; the launcher overrides model.params.n_rotations (C8/C4).
defaults:
  - track_descriptor_base
  - _self_

scale: 64.0

model:
  name: BlobDescriptorEfficient
  params:
    n_rotations: 8
    head: attention
    scale_factors: ["${scale}"]
    in_channels: 1
    l2_normalize: true

training:
  batch_size: 3072
  loss:
    - name: SupCon
      params:
        temperature: 0.09
  optimizer:
    params:
      lr: 7.5e-5
  dataset:
    params:
      patch_type: cartesian
validation:
  dataset:
    params:
      patch_type: cartesian
