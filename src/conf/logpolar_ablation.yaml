# Log-polar descriptor on track data. Model block mirrors blob_descriptor_logpolar;
# the launcher can override model.name=HardNetLogPolar (+ head=fft) for the log-polar
# ablation variants (circ/fft), matching launch_training_matrix.sh's NET_EXTRA.
defaults:
  - track_descriptor_base
  - _self_

head: ???
antialias: ???
circular_pad: ???

scale: 96

model:
  name: HardNetLogPolar
  params:
    in_channels: 1
    patch_size: 64
    head: ${head}
    antialias: ${head}
    circular_pad: ${head}

training:
  dataset:
    params:
      patch_type: logpolar
      balance_view_angles: false
  loss:
    - name: SupCon
validation:
  dataset:
    params:
      patch_type: logpolar
  loss:
    - name: FPR95
experiment_name: ${head}_cirpad_${circular_pad}_antialias_${antialias}

logging:
  model_checkpoints: true
  export_onnx: true
  checkpoint_every_epoch: false
  checkpoint_dir: null
  dir: /raid/data/hsa/evaluation/logpolar_ablation
