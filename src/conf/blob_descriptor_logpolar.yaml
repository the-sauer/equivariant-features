defaults:
  - blob_descriptor_base
  - homography_validation
  - dgx
  - _self_

# THE key hyperparameter for the log-polar descriptor: the outer sampling radius
# factor. Defined once here and threaded (via ${scale}) into the training dataset and
# every validation split, so a single `scale=...` override changes them all.
scale: 16.0

model:
  name: HardNet
  params:
    in_channels: 1   # log-polar patches are single-channel (radial axis encodes scale)
    patch_size: 64

training:
  num_epochs: 100
  dataset:
    params:
      patch_type: logpolar
      logpolar_inner_factor: 2.0
      logpolar_outer_factor: "${scale}"

validation:
  shared_params:
    params:
      patch_type: logpolar
      logpolar_inner_factor: 2.0
      logpolar_outer_factor: "${scale}"
