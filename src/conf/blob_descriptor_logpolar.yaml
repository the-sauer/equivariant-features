defaults:
  - blob_descriptor_base
  - dgx
  - _self_

model:
  name: HardNet
  params:
    in_channels: 1   # log-polar patches are single-channel (radial axis encodes scale)
    patch_size: 64

training:
  dataset:
    params:
      patch_type: logpolar
      logpolar_inner_factor: 2.0
      logpolar_outer_factor: 16.0
      extraction_batch_size: 1024

validation:
  datasets:
    - name: overall
      dataset:
        name: BlobBoardHomographyData
        params:
          in_memory: true
          num_boards: &num_val_boards 8
          seeds: &val_seeds [40, 60, 80, 100, 120, 140, 160, 180]
          image_size: &val_image_size [150, 150]
          transforms_per_image: &val_tpi 1
          transform_params: &val_transform_params
            perspective: false
            fit_to_frame: true
          blobboard_params: &val_blobboard_params
            board_size: [142, 142]
            cutoff: 2
            alpha: 1.6
            max_diameter_fraction: 0.4
            min_scale: 0.2
            frame_width: 10
          patch_type: logpolar
          logpolar_inner_factor: 2.0
          logpolar_outer_factor: 16.0
          extraction_batch_size: 1024
      loss:
        - name: FPR95
    - name: small
      dataset:
        name: BlobBoardHomographyData
        params:
          in_memory: true
          num_boards: *num_val_boards
          seeds: *val_seeds
          image_size: *val_image_size
          transforms_per_image: *val_tpi
          transform_params: *val_transform_params
          blobboard_params: *val_blobboard_params
          scale_quantile_range: [0.0, 0.33]
          patch_type: logpolar
          logpolar_inner_factor: 2.0
          logpolar_outer_factor: 16.0
          extraction_batch_size: 1024
      loss:
        - name: FPR95
          weight: 0   # monitor only; does not affect best.pth
    - name: medium
      dataset:
        name: BlobBoardHomographyData
        params:
          in_memory: true
          num_boards: *num_val_boards
          seeds: *val_seeds
          image_size: *val_image_size
          transforms_per_image: *val_tpi
          transform_params: *val_transform_params
          blobboard_params: *val_blobboard_params
          scale_quantile_range: [0.33, 0.66]   # middle half of blob scales
          patch_type: logpolar
          logpolar_inner_factor: 2.0
          logpolar_outer_factor: 16.0
          extraction_batch_size: 1024
      loss:
        - name: FPR95
          weight: 0   # monitor only; does not affect best.pth
    - name: large
      dataset:
        name: BlobBoardHomographyData
        params:
          in_memory: true
          num_boards: *num_val_boards
          seeds: *val_seeds
          image_size: *val_image_size
          transforms_per_image: *val_tpi
          transform_params: *val_transform_params
          blobboard_params: *val_blobboard_params
          scale_quantile_range: [0.66, 1.0]   # upper quarter of blob scales
          patch_type: logpolar
          logpolar_inner_factor: 2.0
          logpolar_outer_factor: 16.0
          extraction_batch_size: 1024
      loss:
        - name: FPR95
          weight: 0   # monitor only; does not affect best.pth
