training:
  batch_size: 1
  num_epochs: 60
  feature_sampling:
    num_features: 1000
    # stride: 12
    # detector: harris
  dataset:
    params:
      data_dir: /data/datasets
      suffix: train #ILSVRC/Data/CLS-LOC/train
      image_size: [256, 256]
      augmentation:
        color_jitter:
          brightness: 0.5
          contrast: 0.5
          saturation: 0.5
          hue: 0.5
        gaussian_blur:
          kernel_size: 5
          sigma: 1.0
        gaussian_noise:
          mean: 0.0
          sigma: 0.1
logging:
  model_checkpoints: false
  # false -> only `latest.pth` (refreshed each epoch) + `best.pth` are written.
  # true  -> additionally keep a per-epoch `epoch_<n>.pth` snapshot.
  checkpoint_every_epoch: false
  # null -> <logging.dir>/<experiment_name>/checkpoints
  checkpoint_dir: null