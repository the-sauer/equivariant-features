defaults:
  - config
  - _self_

model:
  name: BlobCanonicalization

training:
  num_epochs: 20
  patch_size: 64
  scale_factor: 2
  process_batch: process_batch_canonicalize
  dataset:
    name: BlobBoardHomographyData
    params:
      num_boards: 16
      image_size: [1024, 1024]
      transforms_per_image: 2
      transform_params:
        perspective: false
  batch_size: 500
  optimizer:
    name: SGD
    params:
      lr: 1e-5
      weight_decay: 1e-4
  loss: 
    # - name: BlobLoss
    #   params:
    #     patch_size: [64, 64]
    - name: AlignmentLoss

validation:
  # N training batches between validation runs (on top of the end-of-epoch one);
  # null/0 => once per epoch. See blob_descriptor_base.yaml.
  validate_every_n_batches: null
  dataset:
    name: BlobBoardHomographyData
    params:
      num_boards: 2
      image_size: [1024, 1024]
      transforms_per_image: 2
  batch_size: 1000
  loss: 
    # - name: BlobLoss
    #   params:
    #     patch_size: [64, 64]
    - name: AlignmentLoss

# experiment_name: blob_descriptor_scale_factor_2
