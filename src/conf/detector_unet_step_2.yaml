defaults:
  - detector_unet_dgx
  - _self_

training:
  dataset:
    name: ColmapData
    params:
      images: /data/datasets/south-building
      image_size: [512, 512]
  num_epochs: 120
  loss:
    - name: Contrastive
  process_batch: process_batch_colmap_detector
  epochs: 60
  continue_from_checkpoint: /data/logs/detector_unet_step_2_second_run/checkpoints/epoch_059.pth
  optimizer:
    name: adamw
    params:
      lr: 1e-4
      weight_decay: 1e-4
validation:
  loss:
    - name: Contrastive
      params:
        contrastive_loss: fpr
  dataset:
    name: ColmapData
    params:
      images: /data/datasets/south-building
      image_size: [512, 512]
experiment_name: detector_unet_step_2
