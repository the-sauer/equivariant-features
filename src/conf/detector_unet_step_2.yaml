default:
  - detector_unet_dgx
  - _self_

training:
  loss:
    - name: img_gen
      weight: 0.5
    - name: reprojection
      weight: 0.5
    - name: ContrastiveLoss
    - name: NonSingularLoss
  epochs: 60
  continue_from_checkpoint: /data/logs/detector_unet_step_1/checkpoints/epoch_009.pth
  optimizer:
    name: adamw
    params:
      lr: 1e-4
      weight_decay: 1e-4
experiment_name: detector_unet_step_2
