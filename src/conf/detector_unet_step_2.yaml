default:
  - detector_unet_dgx
  - _self_

model:
  params:
    scale_space:
      name: NeuralScaleSpaceSESN
      params:
        factor: 6.5
        num_scales: 4
        min_scale: 2.0
        effective_size: 5
training:
  loss:
    - name: img_gen
    - name: reprojection
    - name: DeterminantLoss
      params:
        goal: 1
  epochs: 60
  continue_from_checkpoint: /data/logs/detector_unet_step_1/checkpoints/epoch_009.pth
experiment_name: detector_unet_step_2
