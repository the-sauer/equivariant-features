defaults:
  - config
  - override model: affine_feature_net_canonical_one
  - _self_

training:
  dataset:
    name: blobboards_homographic
    params:
      image_size: [256, 256]
      num_boards: 120
      blobboard_params:
        cutoff: 2.0
  loss:
    - name: "reprojection"
      params:
        distance_metric: "euclidean"
      weight: 1
    - name: geodesic
      weight: 1
  optimizer:
    scale_space:
      name: "adam"
      params:
        lr: 1e-3
        weight_decay: 5e-5
      scheduler:
        name: "mulistep"
        params:
          milestones: [20, 40]
          gamma: 0.1
    feature_net:
      name: "adamw"
      params:
        lr: 2e-3
      scheduler:
        name: "cosine"
        params:
          T_max: 50   
validation:
  dataset:
    name: blobboards_homographic
    params:
      image_size: [256, 256]
      num_boards: 12
      blobboard_params:
        cutoff: 2.0
logging:
  interval: 1
