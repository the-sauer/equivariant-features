# Log-polar track descriptor, validated per viewing-angle band.
#
# = `track_descriptor_logpolar` + the `track_angle_validation` overlay, i.e. identical
# training, but validation is split into 10-degree bands of viewing obliquity so the
# run reports FPR95@deg00_10 ... FPR95@deg50_90 next to the unfiltered FPR95@all.
# Answers "where does the descriptor actually break down under foreshortening?", which
# a single averaged number hides.
#
#   pixi run --manifest-path deps/BlobBoards.jl/pixi.toml \
#     python src/run_training.py --config-name track_descriptor_logpolar_angles \
#     track_path=/raid/data/hsa/datasets/tracks_logpolar_s16.tracks
#
# The `.tracks` file must carry `view_angles` (BlobBoards' build_tracks_for_sequences);
# older files make the bands fail loudly rather than silently evaluate unfiltered data.
# `+validation.dataset.params.log_stats=true` prints the angle histogram of the file.
defaults:
  - track_descriptor_logpolar
  - track_angle_validation
  - _self_

# The bands inherit everything else (h5_path, val boards, patch_type) from
# `validation.dataset` via `validation.shared_params` — set overrides there, not here.
