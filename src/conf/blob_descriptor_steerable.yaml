defaults:
  - config
  - _self_

model:
  name: BlobDescriptorHierarchical
  params:
    scale_factors: [4.0, 16.0, 64.0]
    in_channels: 3

training:
  num_epochs: 100
  patch_size: 64
  process_batch: process_batch_blobs
  dataset:
    name: BlobBoardHomographyData
    params:
      num_boards: 8
      image_size: [150, 150]
      transforms_per_image: 7
      in_memory: true
      transform_params:
        perspective: false
      blobboard_params:
        board_size: [142, 142]
        cutoff: 2
        alpha: 1.6
        max_diameter_fraction: 0.4
        min_scale: 0.2
        frame_width: 10
      patch_scale_factors: [4.0, 16.0,  64.0]
  batch_size: 2048
  optimizer:
    name: AdamW
    params:
      lr: 5e-3
      weight_decay: 1e-4
    scheduler:
      - name: LinearLR
        parameter:
          start_factor: 1e-3
          last_epoch: 10
          total_iters: 10
      - name: CosineAnnealingLR
        parameter:
          T_max: 100
          last_epoch: 100
        
  loss: 
    - name: SupCon
      parameters:
        temperature: 0.3

validation:
  dataset:
    name: BlobBoardHomographyData
    params:
      in_memory: true
      num_boards: 1
      image_size: [150, 150]
      transforms_per_image: 7
      blobboard_params:
        board_size: [142, 142]
        cutoff: 2
        alpha: 1.6
        max_diameter_fraction: 0.4
        min_scale: 0.2
        frame_width: 10
      patch_scale_factors: [4.0, 16.0,  64.0]
  batch_size: 4096
  loss:
    - name: FPR95

