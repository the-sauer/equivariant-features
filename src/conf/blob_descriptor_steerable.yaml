defaults:
  - blob_descriptor_base
  - dgx
  - _self_

model:
  name: BlobDescriptorNoStride
  params:
    scale_factors: [16.0]
    in_channels: 1

training:
  batch_size: 1024
  dataset:
    params:
      patch_type: cartesian
      patch_scale_factors: [16.0]
      extraction_batch_size: 512
  optimizer:
    name: AdamW

# FPR95 is reported per blob-scale band. All three validation sets are the SAME
# pinned board (seeds: [40], a validation-split seed the training boards never
# draw), so `overall` is exactly the union of `small` and `large`. The small/large
# sets keep only the lower/upper half of the board's intrinsic blob-scale
# distribution (scale_quantile_range), splitting at the median. Reported as
# FPR95@overall / FPR95@small / FPR95@large. Only the overall FPR drives best.pth
# selection (small/large carry weight 0, so they are monitored but not optimized).
validation:
  dataset:
    params:
      patch_type: cartesian
      patch_scale_factors: [16.0]
      extraction_batch_size: 512
