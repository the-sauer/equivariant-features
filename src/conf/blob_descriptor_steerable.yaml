defaults:
  - config
  - _self_

model:
  name: BlobDescriptorNoStride
  params:
    n_rotations: 8

training:
  num_epochs: 20
  patch_size: 64
  scale_factor: 2
  process_batch: process_batch_blobs
  dataset:
    name: BlobBoardHomographyData
    params:
      num_boards: 80
      image_size: [1024, 1024]
      transforms_per_image: 2
  batch_size: 5000
  optimizer:
    name: SGD
    params:
      lr: 1e-3
      weight_decay: 1e-4
  loss: 
    - name: SupCon

validation:
  dataset:
    name: BlobBoardHomographyData
    params:
      num_boards: 10
      image_size: [1024, 1024]
      transforms_per_image: 2
  batch_size: 1000
  loss: 
    - name: FPR95

experiment_name: blob_descriptor_scale_factor_2
