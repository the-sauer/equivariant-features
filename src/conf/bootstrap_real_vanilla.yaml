# Log-polar descriptor on real track data, one bootstrap iteration.
# Submitted by `bootstrap_real.sh` / `bootstrap_real_vanilla.sh` with BB_ITERATION set.
defaults:
  - track_descriptor_base
  - _self_

iteration: ???
scale: 96
track_path: /raid/data/hsa/datasets/BlobBoardTrainingFootage/final/tracks/iteration_${iteration}_logpolar_s${scale}.tracks

model:
  name: HardNetLogPolar
  params:
    in_channels: 1
    patch_size: 64
    head: maxpool
    antialias: true
    circular_pad: true

training:
  dataset:
    params:
      balance_view_angles: false
  loss:
    - name: SupCon
validation:
  loss:
    - name: FPR95
experiment_name: bootstrap_real_iteration_${iteration}

logging:
  model_checkpoints: true
  export_onnx: true
  checkpoint_every_epoch: false
  checkpoint_dir: null
  dir: /raid/data/hsa/datasets/BlobBoardTrainingFootage/final_vanilla/networks
