# Log-polar descriptor on track data. Model block mirrors blob_descriptor_logpolar;
# the launcher can override model.name=HardNetLogPolar (+ head=fft) for the log-polar
# ablation variants (circ/fft), matching launch_training_matrix.sh's NET_EXTRA.
defaults:
  - track_descriptor_base
  - _self_

scale: 96
track_path: /raid/data/hsa/datasets/BlobBoardTrainingFootage/final/tracks/iteration_3_logpolar_s96.tracks

model:
  name: HardNetLogPolar
  params:
    in_channels: 1
    patch_size: 64
    head: fft
    n_harmonics: 5
    antialias: true
    circular_pad: true

training:
  num_epochs: 25
  dataset:
    params:
      patch_type: logpolar
    loss:
      - name: ProxyAnchoredSupCon
validation:
  validate_every_n_batches: 25
  dataset:
    params:
      patch_type: logpolar
  loss:
   - name: ProxyAnchoredFPR95
   - name: FPR95

experiment_name: loss_compare_supcon


logging:
  model_checkpoints: true
  export_onnx: true
  checkpoint_every_epoch: false
  checkpoint_dir: null
  dir: /raid/data/hsa/logs/2026_08_24/loss_compare
