[workspace]
authors = ["Hendrik Sauer <hendrik-sauer@mailbox.org>"]
channels = ["conda-forge"]
name = "equivariant-features"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
[activation.env]
JULIA_CONDAPKG_BACKEND = "Null"
JULIA_PYTHONCALL_EXE = "$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python"

[dependencies]
# NOTE: do NOT add conda-forge `julia` here. Its activate.d script repoints
# JULIA_DEPOT_PATH at an env-local depot, and juliacall then dies in
# micromamba_jll's __init__ ("Artifact \"micromamba\" is a lazy artifact") --
# Pkg.add/resolve/precompile never fetch lazy artifacts, so a fresh depot has
# no micromamba. juliapkg installs its own Julia under .pixi/.../julia_env
# anyway; leaving the depot at ~/.julia is what makes PythonCall start.
pytest = ">=9.1.1,<10"
pint = ">=0.25.3,<0.26"

[pypi-dependencies]
h5py = ">=3.16,<4"
escnn = ">=1,<2"
hydra-core = ">=1.3,<2"
kagglehub = ">=1.0,<2"
kornia = ">=0.8,<1"
lie-learn = ">=0.0.2,<1"
matplotlib = "*"
numpy = "*"
python-dotenv = "*"
pytorch-metric-learning = ">=1.2,<2"
torch = ">=2.11,<3"
torchvision = ">=0.26,<1"
tqdm = ">=4.67,<5"
juliacall = ">=0.9,<1"
blobboards = { path = "./deps/BlobBoards.jl/python", editable = true }
